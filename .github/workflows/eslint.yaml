name: ESLint
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install modules
      run: sudo npm install eslint@8.57.0 -g
    - name: Run ESLint
      run: eslint . -f tap --ext .js,.mjs,.jsx,.ts,.tsx
    - name: Run watcher regression tests
      run: node --experimental-vm-modules --test tests/testStatusNotifierWatcher.mjs
